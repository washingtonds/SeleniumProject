name: Smoke Tests - PR

on:
  pull_request:
    branches: [ master ]

jobs:
  RunTest:
    runs-on: ubuntu-latest
      
    steps:
      - name: Clonar o projeto
        uses: actions/checkout@v6

      - name: Instalar o Java 11
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: '11'
          check-latest: true
          cache: 'maven'

      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Instalar Chrome Driver
        uses: nanasess/setup-chromedriver@v2
      - run: |
          export DISPLAY=:99
          chromedriver --url-base=/wd/hub &
          sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &

      - name: Run tests
        run: mvn test -Dtest=RunCucumber -Dbrowser=chrome-ci

      - name: Gerar relatorio
        if: always()
        run: mvn cluecumber-report:reporting

      - name: Arquivar Relatorio
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-test
          path: "**/formated-report/"

      - name: Notificação Slack sucesso
        if: ${{ success() }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: ${{ job.status }}
          SLACK_ICON: https://www.pngwing.com/pt/free-png-nhbsg
          SLACK_MESSAGE: "Sucesso na execução :white_check_mark:"

      - name: Notificação Slack falha
        if: ${{ failure() }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: ${{ job.status }}
          SLACK_ICON: https://www.pngwing.com/pt/free-png-vohup
          SLACK_MESSAGE: "Falha na execução :fire:"